[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "zeno-ts"
version = "0.1.0"
description = "Zero-copy time series library for modern AI"
requires-python = ">=3.8"
dependencies = [
    "polars>=1.38.1",
    "pyarrow>=23.0.0",
    "numpy>=1.17.0",
    "transformers>=5.1.0",    # Remove pin
    "gluonts>=0.14.3",         # Remove pin
    "uni2ts",         # Remove pin
    "torch>=2.0.0",
    "boto3>=1.28.0",
    "weasyprint>=68.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-benchmark>=5.2.3",
    "ruff>=0.1.0",
]

[tool.maturin]
# Point to the Rust crate in ../zeno-core
manifest-path = "../zeno-core/Cargo.toml"
python-source = "."
module-name = "zeno._zeno"
